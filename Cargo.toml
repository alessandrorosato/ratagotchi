[package]
name = "ratagotchi"
version = "0.5.0"
edition = "2024"
description = "Take care of a cute rat living in your terminal!"
authors = ["Alessandro Rosato <hello@alessandrorosato.com>"]
license = "GPL-3.0-only"
homepage = "https://github.com/alessandrorosato/ratagotchi"
repository = "https://github.com/alessandrorosato/ratagotchi"
readme = "README.MD"


[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
directories = "6.0.0"
image = "0.25.10"
log = "0.4.30"
log4rs = { version = "1.4.0", default-features = false, features = [
    "file_appender",
] }
rand = "0.10.1"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tui-big-text = "0.8.4"
